<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>Tech Exchange — Talk • Learn • Build | Nepal's Tech Enthusiasts Ecosystem</title>
    <meta name="description" content="Tech Exchange is Nepal's tech enthusiasts ecosystem. Explore tech podcasts, programming courses, developer tutorials, software services, tech jobs, and community discussions. Talk • Learn • Build." />
    <meta name="keywords" content="Tech Exchange, Nepal tech, developer community, tech podcasts, programming courses, software development, AI agents, tech jobs Nepal, remote engineering, developer tutorials, fullstack development, Next.js, React, Python, DevOps" />
    <meta name="author" content="Tech Exchange — techexchange.dev" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.techexchange.dev/" />

    <!-- Favicon & Icons -->
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <!-- Open Graph (Facebook, LinkedIn, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tech Exchange" />
    <meta property="og:title" content="Tech Exchange — Talk • Learn • Build | Nepal's Tech Enthusiasts Ecosystem" />
    <meta property="og:description" content="Podcasts, courses, tutorials, software services, tech jobs, and community — one platform for Nepal's tech enthusiasts and developers worldwide." />
    <meta property="og:url" content="https://www.techexchange.dev/" />
    <meta property="og:image" content="https://www.techexchange.dev/logo.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tech Exchange — Talk • Learn • Build" />
    <meta name="twitter:description" content="Nepal's tech enthusiasts ecosystem. Podcasts, courses, tutorials, software services, and developer community." />
    <meta name="twitter:image" content="https://www.techexchange.dev/logo.png" />
    <meta name="twitter:site" content="@techexchange" />

    <!-- Geo & Language -->
    <meta name="geo.region" content="NP" />
    <meta name="geo.placename" content="Nepal" />
    <meta http-equiv="content-language" content="en" />

    <!-- Theme Color (browser address bar) -->
    <meta name="theme-color" content="#1e293b" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />

    <!-- Structured Data: Organization (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Tech Exchange",
        "alternateName": "techexchange.dev",
        "url": "https://www.techexchange.dev",
        "logo": "https://www.techexchange.dev/logo.png",
        "description": "Nepal's tech enthusiasts ecosystem — podcasts, programming courses, developer tutorials, software engineering services, tech jobs, and community discussions.",
        "foundingDate": "2026",
        "founder": {
          "@type": "Person",
          "name": "Dinesh Gajurel",
          "url": "https://www.linkedin.com/in/dinesh-gajurel/"
        },
        "sameAs": [
          "https://github.com/dineshgajurel",
          "https://www.linkedin.com/in/dinesh-gajurel/",
          "https://www.youtube.com/@techexchange"
        ],
        "contactPoint": {
          "@type": "ContactPoint",
          "contactType": "customer service",
          "availableLanguage": ["English", "Nepali"]
        },
        "areaServed": {
          "@type": "GeoCircle",
          "geoMidpoint": {
            "@type": "GeoCoordinates",
            "latitude": 27.7172,
            "longitude": 85.3240
          },
          "geoRadius": "5000 km"
        }
      }
    </script>

    <!-- Structured Data: WebSite (enables sitelinks search in Google) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Tech Exchange",
        "url": "https://www.techexchange.dev",
        "description": "Talk • Learn • Build — Nepal's tech enthusiasts ecosystem.",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://www.techexchange.dev/?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>

    <!-- Google Fonts: Plus Jakarta Sans & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased font-sans selection:bg-blue-600 selection:text-white transition-colors duration-300">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
